name: CI

# Builds every push and pull request so a broken main branch is caught before a tag is cut.
# Instrumented tests need a device and stay out of CI; run them locally with
# ./gradlew :app:connectedDebugAndroidTest.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AGP generates a debug keystore in $HOME/.android on first use. Restoring it keeps the debug
      # APK signature stable across runs, so a new build installs over the previous one instead of
      # requiring an uninstall first.
      - name: Restore the debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Run unit tests and assemble both variants
        run: |
          ./gradlew --no-daemon \
            :scrcpy:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease \
            -PascrcpyVersionCode=$((10400 + ${GITHUB_RUN_NUMBER})) \
            -PascrcpyVersionName="1.4.${GITHUB_RUN_NUMBER}"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
          retention-days: 7
